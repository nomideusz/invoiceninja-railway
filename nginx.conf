user www-data;
# `auto` would start one worker per host CPU (48 on Railway), ~150 MB for nothing.
worker_processes 2;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log off;  # Railway logs every request at the edge

    client_max_body_size 10M;  # php.ini allows 10 MB uploads
    fastcgi_buffers 32 16k;
    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The visitor's address: Railway's edge connects from 100.64.0.0/10 and sets
    # X-Real-IP to the client, overwriting what the client sent. X-Forwarded-For
    # ends in an edge hop, and Laravel trusts no proxy here, so it takes
    # REMOTE_ADDR as is (login throttling, client portal logs).
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Real-IP;

    # TLS ends at the edge; tell PHP the request was HTTPS so Laravel builds
    # https:// links and Invoice Ninja's REQUIRE_HTTPS doesn't redirect in a loop.
    map $http_x_forwarded_proto $edge_https {
        https on;
        default "";
    }

    server {
        listen 8080;
        listen [::]:8080;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param HTTPS $edge_https if_not_empty;
            fastcgi_read_timeout 300s;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
