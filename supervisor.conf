[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Nightly at 03:00 UTC; a failed backup is logged and retried the next night.
[program:backup]
command=/bin/sh -c 'while sleep $(( (97200 - $(date +%%s) %% 86400) %% 86400 )); do invoiceninja-backup || true; done'
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
